name: checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for owner/machine-specific data and secrets
        run: bash scripts/leak-check.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install editor test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          curl -fsSL -o "$RUNNER_TEMP/nvim.tar.gz" https://github.com/neovim/neovim/releases/download/v0.11.5/nvim-linux-x86_64.tar.gz
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Syntax, import, and tests
        run: |
          python -m compileall -q bin/ server/
          pip install -q -r server/requirements-dev.txt
          cd server
          python -c "import main"
          pytest -q

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n all scripts
        run: |
          bash -n install.sh bin/bopbop bin/claude-note.sh \
            bin/claude-sessions.sh scripts/leak-check.sh .githooks/pre-commit

  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check && npm test && npm run build && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pwa-browser-failures
          path: test-results/
